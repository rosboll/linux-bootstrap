# Machine-specific configuration
# Format: hostname role is_pentest is_vm
# role:       daily | lab | homelab
# is_pentest: yes | no  (controls whether 60-pentest-tools.sh installs anything)
# is_vm:      yes | no  (skips virt and YubiKey-PAM steps when running inside a VM)
#
# Hostnames not listed here get defaults: role=daily, is_pentest=no, is_vm=no

t14            daily    yes    no
p52            lab      yes    no
p15            homelab  no     no
ColorJet4250   daily    yes    no
kaliv          lab      yes    yes
